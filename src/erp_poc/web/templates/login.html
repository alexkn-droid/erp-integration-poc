{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:360px; margin: 40px auto;">
  <h1>Log in</h1>
  <p class="muted">This is an internal prototype. Anyone with the shared password can use it — see README for security limitations.</p>
  <form method="post" action="/login" class="stacked">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">Shared password</label>
    <input type="password" id="password" name="password" required autofocus>
    {% if error %}<p class="error-list"><li>{{ error }}</li></p>{% endif %}
    <div class="actions">
      <button type="submit">Log in</button>
    </div>
  </form>
</div>
{% endblock %}
